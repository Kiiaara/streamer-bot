{% extends "base.html" %}
{% block title %}Вход — Травобот{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-10 max-w-md w-full text-center">
    <div class="text-3xl mb-2">Травобот</div>
    <div class="text-slate-400 mb-8">Админка контента</div>
    <div class="flex justify-center my-6">
      <script async src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="{{ bot_username }}"
        data-size="large"
        data-radius="10"
        data-auth-url="{{ auth_url }}"
        data-request-access="write"></script>
    </div>
    <div class="text-slate-500 text-sm">Доступ только по whitelist Telegram username.</div>
  </div>
</div>
{% endblock %}
