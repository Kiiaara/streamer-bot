services:
  nginx:
    image: nginx:1.27-alpine
    container_name: travobot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    network_mode: host  # чтоб достучаться до admin на 127.0.0.1:9000

  certbot:
    image: certbot/certbot:latest
    container_name: travobot-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Запускаем вручную через docker compose run для получения и обновления сертификата
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
